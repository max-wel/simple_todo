name: Simple todo ci/cd pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: simple_todo:latest


